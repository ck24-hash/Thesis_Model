[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghmodel"
version = "0.1.0"
description = "Greenhouse heat, CO2 and electricity dispatch model (PyPSA), EPFL x Voltiris thesis"
requires-python = ">=3.10"
dependencies = ["pypsa>=1.0", "highspy", "pandas", "numpy", "matplotlib", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
